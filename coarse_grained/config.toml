# Soap + propylene glycol CG system
# 10% each of C12/C14/C16/C18 soaps, 10% water, 50% propylene glycol (by weight)
# Counts computed with 200 stearate as reference

# ── Charged solutes (counterions are auto-computed) ───────────────────

[[solutes]]
name     = "LAU"
count    = 276
n_beads  = 4
is_chain = true

[[solutes]]
name     = "MYR"
count    = 245
n_beads  = 4
is_chain = true

[[solutes]]
name     = "PAL"
count    = 220
n_beads  = 5
is_chain = true

[[solutes]]
name     = "STR"
count    = 200
n_beads  = 5
is_chain = true

# ── Counterions (fractions must sum to 1.0) ───────────────────────────

[[counterions]]
name     = "NA+"
fraction = 0.7

[[counterions]]
name     = "K+"
fraction = 0.3

# ── Neutral solvents ──────────────────────────────────────────────────

[[solvents]]
name     = "PGO"
count    = 4029
n_beads  = 1
is_chain = false

[[solvents]]
name     = "W"
count    = 851
n_beads  = 1
is_chain = false

# ── System settings ───────────────────────────────────────────────────

[system]
box  = [15.0, 15.0, 15.0]   # nm
name = "Soap-PG CG System"

[simulation]
temperature = 353.15         # K (80 C)
pressure    = 1.0            # bar
