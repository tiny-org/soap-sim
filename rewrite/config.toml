# ── System composition ────────────────────────────────────────────────
[system]
num_stearate     = 80       # number of sodium stearate ion pairs
weight_fraction  = 0.10     # mass fraction of sodium stearate (0-1)
target_density   = 1.0      # g/cm³, used only to estimate initial box size
# num_water is computed automatically from weight_fraction

# ── Force field ───────────────────────────────────────────────────────
[forcefield]
small_molecule = "openff-2.2.0.offxml"   # OpenFF Sage for stearate + Na+
water_model    = "tip3p.xml"

# ── Simulation protocol ──────────────────────────────────────────────
[simulation]
temperature_celsius = 80.0
pressure_bar        = 1.0
timestep_fs         = 2.0
friction_per_ps     = 1.0
platform            = "auto"    # auto | CUDA | OpenCL | CPU | Reference

[simulation.minimize]
max_iterations = 1000

[simulation.equilibrate]
steps        = 50_000      # 100 ps NVT thermalisation
log_interval = 500

[simulation.production]
steps               = 15_000_000   # 10 ns NPT production
dcd_interval        = 5000
log_interval        = 5000
checkpoint_interval = 10_000

# ── Output ────────────────────────────────────────────────────────────
[output]
directory = "output"
